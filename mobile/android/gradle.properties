org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Kotlin's incremental compiler cannot close its own caches on this machine —
# every plugin fails with "Could not close incremental caches in
# build/<plugin>/kotlin/.../caches-jvm", and the build dies before Dart is
# even reached. Turning it off costs a slower rebuild of the plugins, which
# are compiled once and rarely change, and buys a build that finishes.
kotlin.incremental=false
